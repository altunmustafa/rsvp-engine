name: Changesets PR Status

on:
  pull_request_target:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-status:
    name: Generate Changesets status
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      comment-body: ${{ steps.pr-status.outputs.comment-body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate Changesets status
        id: pr-status
        uses: changesets/action/pr-status@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1

  pr-comment:
    name: Comment Changesets status
    needs: pr-status
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Comment on pull request
        uses: changesets/action/pr-comment@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          body: ${{ needs.pr-status.outputs.comment-body }}
