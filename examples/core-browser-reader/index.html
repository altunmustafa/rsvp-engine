<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A minimal browser example for @rsvp-engine/core" />
    <title>RSVP Core Browser Example</title>
  </head>
  <body>
    <main>
      <h1>RSVP Core Browser Example</h1>

      <label for="source-text">Text</label>
      <textarea id="source-text" rows="5">
Rapid serial visual presentation (RSVP) is a scientific method for studying the timing of vision. In RSVP, a sequence of stimuli is shown to an observer at one location in their visual field. The observer is instructed to report one of these stimuli – the target – which has a feature that differentiates it from the rest of the stream. For instance, observers may see a sequence of stimuli consisting of gray letters with the exception of one red letter. They are told to report the red letter. People make errors in this task in the form of reports of stimuli that occurred before or after the target. The position in time of the letter they report, relative to the target, is an estimate of the timing of visual selection on that trial.</textarea>

      <div class="settings">
        <label for="wpm">Words per minute</label>
        <input id="wpm" type="number" min="1" max="6000" value="300" />
        <button id="load" type="button">Load text</button>
      </div>

      <div id="word" class="word" aria-label="Current word">
        <span id="word-before" class="word-before">Re</span>
        <span id="word-ovp" class="ovp">a</span>
        <span id="word-after" class="word-after">dy</span>
      </div>

      <div class="controls" aria-label="Playback controls">
        <button id="play" type="button">Play</button>
        <button id="pause" type="button">Pause</button>
        <button id="stop" type="button">Stop</button>
      </div>

      <label for="progress">Progress</label>
      <progress id="progress" max="1" value="0">0%</progress>
      <output id="progress-text" for="progress">0%</output>

      <p id="status" role="status">State: IDLE</p>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
